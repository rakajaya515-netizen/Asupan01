<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial;
}

.player {
  width: 100%;
  height: 100vh;
}

video, iframe {
  width: 100%;
  height: 100%;
  border: none;
}

.error {
  text-align: center;
  padding: 20px;
  color: red;
}
</style>
</head>
<body>

<div class="player" id="player"></div>
<div class="error" id="error"></div>

<script>
const params = new URLSearchParams(window.location.search);
const url = params.get("url");

const player = document.getElementById("player");
const error = document.getElementById("error");

if (!url) {
  error.innerText = "URL tidak ditemukan";
}

/* DETEKSI */
function isMP4(u) {
  return u.includes(".mp4");
}

function isM3U8(u) {
  return u.includes(".m3u8");
}

function isEmbed(u) {
  return u.includes("dood") || u.includes("/e/");
}

try {
  if (isMP4(url)) {
    const video = document.createElement("video");
    video.src = url;
    video.controls = true;
    video.autoplay = true;

    video.onerror = () => {
      error.innerText = "Gagal memutar video MP4";
    };

    player.appendChild(video);

  } else if (isEmbed(url)) {
    const iframe = document.createElement("iframe");
    iframe.src = url;
    iframe.allowFullscreen = true;

    player.appendChild(iframe);

  } else if (isM3U8(url)) {
    error.innerText = "Format HLS butuh player tambahan (hls.js)";
  } else {
    error.innerText = "Format tidak didukung";
  }

} catch (e) {
  error.innerText = "Terjadi error";
  console.log(e);
}
</script>

</body>
</html>
