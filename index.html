<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streaming App</title>

<style>
body {
  margin: 0;
  background: #0f0f0f;
  color: white;
  font-family: sans-serif;
}

/* SEARCH */
.search {
  padding: 10px;
}
.search input {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 10px;
}

.card {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
}

.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.overlay {
  position: absolute;
  bottom: 0;
  padding: 10px;
  background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
}

/* PLAYER MODAL */
#modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  display: none;
  flex-direction: column;
}

#modal iframe {
  width: 100%;
  height: 100%;
  border: none;
}

.close {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 25px;
  z-index: 10;
}

/* LOADING */
.loading {
  text-align: center;
  padding: 20px;
}
</style>
</head>

<body>

<div class="search">
  <input type="text" id="search" placeholder="Search video...">
</div>

<div class="grid" id="videos"></div>

<div class="loading" id="loading">Loading...</div>

<!-- PLAYER -->
<div id="modal">
  <div class="close" onclick="closePlayer()">✖</div>
  <iframe id="player"></iframe>
</div>

<script>
let allVideos = [];
let page = 0;
let limit = 20;

/* LOAD DATA */
async function loadVideos() {
  const res = await fetch("/api/videos");
  const data = await res.json();

  allVideos = data.videos;
  render();
}

/* RENDER */
function render() {
  const container = document.getElementById("videos");

  const start = page * limit;
  const end = start + limit;

  const items = allVideos.slice(start, end);

  items.forEach(v => {
    container.innerHTML += `
      <div class="card" onclick="play('${v.filecode}')">
        <img src="${v.thumbnail}">
        <div class="overlay">${v.title}</div>
      </div>
    `;
  });

  page++;
}

/* INFINITE SCROLL */
window.onscroll = () => {
  if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 100) {
    render();
  }
};

/* SEARCH */
document.getElementById("search").addEventListener("input", e => {
  const keyword = e.target.value.toLowerCase();

  const filtered = allVideos.filter(v =>
    v.title.toLowerCase().includes(keyword)
  );

  document.getElementById("videos").innerHTML = "";
  page = 0;
  allVideos = filtered;
  render();
});

/* PLAY */
function play(code) {
  document.getElementById("modal").style.display = "flex";

  // embed resmi (AMAN)
  document.getElementById("player").src =
    "https://vidara.to/e/" + code;
}

/* CLOSE */
function closePlayer() {
  document.getElementById("modal").style.display = "none";
  document.getElementById("player").src = "";
}

loadVideos();
</script>

</body>
</html>
