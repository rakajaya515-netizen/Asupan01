<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Asupanmu</title>

  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    h1 {
      padding: 15px;
      margin: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 10px;
    }

    .card {
      background: #1a1a1a;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.2s;
    }

    .card:hover {
      transform: scale(1.02);
    }

    .thumb {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }

    .title {
      padding: 8px;
      font-size: 13px;
      color: #ccc;
    }

    /* MODAL PLAYER */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .modal iframe {
      width: 90%;
      height: 60%;
      border: none;
      border-radius: 10px;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 25px;
      cursor: pointer;
    }

    .loader {
      text-align: center;
      padding: 20px;
      color: #888;
    }
  </style>
</head>

<body>

<h1>Asupanmu</h1>

<div id="videos" class="grid"></div>
<div id="loader" class="loader">Loading...</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <span class="close" onclick="closePlayer()">✕</span>
  <iframe id="player" allowfullscreen></iframe>
</div>

<script>
let page = 0
const limit = 20
let allVideos = []
let loading = false

// =======================
// LOAD DATA API
// =======================
async function loadVideos() {
  try {
    const res = await fetch("/api/videos", {
      cache: "force-cache"
    })

    const data = await res.json()

    allVideos = data.result.videos || []

    render()
  } catch (err) {
    document.getElementById("loader").innerText = "Gagal load video"
  }
}

// =======================
// RENDER VIDEO
// =======================
function render() {
  if (loading) return
  loading = true

  const container = document.getElementById("videos")

  const start = page * limit
  const end = start + limit

  const slice = allVideos.slice(start, end)

  if (slice.length === 0) {
    document.getElementById("loader").innerText = "Tidak ada video"
    return
  }

  slice.forEach(v => {
    const div = document.createElement("div")
    div.className = "card"

    div.innerHTML = `
      <img class="thumb" src="${v.thumbnail}" />
      <div class="title">${v.title}</div>
    `

    div.onclick = () => playVideo(v)

    container.appendChild(div)
  })

  page++
  loading = false
}

// =======================
// PLAY VIDEO (MODAL)
// =======================
function playVideo(v) {
  const modal = document.getElementById("modal")
  const player = document.getElementById("player")

  let url = ""

  if (v.source === "vizey") {
    url = `https://vizey.co/e/${v.filecode}`
  } else {
    url = `https://vidara.to/e/${v.filecode}`
  }

  player.src = url
  modal.style.display = "flex"
}

// =======================
// CLOSE PLAYER
// =======================
function closePlayer() {
  const modal = document.getElementById("modal")
  const player = document.getElementById("player")

  modal.style.display = "none"
  player.src = ""
}

// =======================
// INFINITE SCROLL
// =======================
window.addEventListener("scroll", () => {
  if (
    window.innerHeight + window.scrollY >=
    document.body.offsetHeight - 200
  ) {
    render()
  }
})

// =======================
// INIT
// =======================
loadVideos()
</script>

</body>
</html>
