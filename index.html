<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streaming</title>

  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      font-family: sans-serif;
      color: white;
    }

    .search {
      padding: 15px;
    }

    .search input {
      width: 100%;
      padding: 12px;
      border-radius: 25px;
      border: none;
      background: #1c1c1c;
      color: white;
      outline: none;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 10px;
    }

    .card {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    }

    .overlay p {
      margin: 0;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="search">
  <input type="text" id="searchInput" placeholder="Search...">
</div>

<div class="grid" id="videos"></div>

<script>
let allVideos = [];

async function loadVideos() {
  try {
    const res = await fetch("/api/videos");
    const data = await res.json();

    console.log("DATA:", data);

    allVideos = data.result.videos;
    renderVideos(allVideos);

  } catch (err) {
    console.log("Error:", err);
  }
}

function renderVideos(videos) {
  const container = document.getElementById("videos");
  container.innerHTML = "";

  videos.forEach(v => {
    container.innerHTML += `
      <div class="card" onclick="play('${v.filecode}')">
        <img src="${v.thumbnail}">
        <div class="overlay">
          <p>${v.title || 'No Title'}</p>
        </div>
      </div>
    `;
  });
}

function play(code) {
  // 🔥 Cara paling aman (PASTI WORK)
  window.open("https://vidara.to/v/" + code, "_blank");
}

// SEARCH
document.getElementById("searchInput").addEventListener("input", function() {
  const keyword = this.value.toLowerCase();

  const filtered = allVideos.filter(v =>
    (v.title || "").toLowerCase().includes(keyword)
  );

  renderVideos(filtered);
});

loadVideos();
</script>

</body>
</html>
