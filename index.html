<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asupanmu</title>

<style>
body {
  background: #000;
  color: white;
  font-family: sans-serif;
  margin: 0;
}

h1 {
  padding: 20px;
}

#search {
  width: 90%;
  margin: 10px;
  padding: 12px;
  border-radius: 10px;
  border: 2px solid orange;
  font-size: 16px;
}

.video {
  margin: 15px;
  cursor: pointer;
}

.video img {
  width: 100%;
  border-radius: 10px;
}

.video p {
  margin: 5px 0;
}

.ads {
  text-align: center;
  margin: 15px;
}

button {
  background: black;
  color: blue;
  padding: 10px;
  border-radius: 10px;
  border: none;
}
</style>

</head>
<body>

<h1>Asupanmu</h1>

<!-- IKLAN (1x klik saja) -->
<div class="ads">
  <button onclick="bukaIklan()">🔥 Klik di sini 🔥</button>
</div>

<input id="search" placeholder="Cari video...">

<div id="videoList"></div>

<script>
let semuaVideo = []
let iklanSudah = false

// ======================
// IKLAN (1x saja)
// ======================
function bukaIklan() {
  if (!iklanSudah) {
    window.open("https://www.profitablecpmratenetwork.com/s6szeryj1j?key=67a910e3b4387aa420b25f4a4bfa41b1", "_blank")
    iklanSudah = true
  }
}

// ======================
// LOAD API
// ======================
async function loadVideos() {
  try {
    const res = await fetch("/api/videos")
    const data = await res.json()

    semuaVideo = data.videos || []
    tampilkanVideo(semuaVideo)

  } catch (err) {
    document.getElementById("videoList").innerHTML =
      "<p style='color:red'>Gagal load video</p>"
  }
}

// ======================
// RENDER VIDEO
// ======================
function tampilkanVideo(videos) {
  const list = document.getElementById("videoList")
  list.innerHTML = ""

  if (videos.length === 0) {
    list.innerHTML = "<p>Tidak ada video</p>"
    return
  }

  videos.forEach(v => {
    const div = document.createElement("div")
    div.className = "video"

    div.innerHTML = `
      <img src="${v.thumbnail}">
      <p>${v.title}</p>
    `

    div.onclick = () => playVideo(v.filecode, v.source)

    list.appendChild(div)
  })
}

// ======================
// PLAY VIDEO
// ======================
function playVideo(id, source) {
  if (source === "vidara") {
    window.location.href = `https://vidara.so/v/${id}`
  } else {
    window.location.href = `https://doodstream.com/d/${id}`
  }
}

// ======================
// SEARCH
// ======================
document.getElementById("search").addEventListener("input", e => {
  const keyword = e.target.value.toLowerCase()

  const hasil = semuaVideo.filter(v =>
    v.title.toLowerCase().includes(keyword)
  )

  tampilkanVideo(hasil)
})

// ======================
loadVideos()
</script>

</body>
</html>
