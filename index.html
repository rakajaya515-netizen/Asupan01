    <!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Asupanmu</title>

<style>
body {
  margin:0;
  font-family:sans-serif;
  background:#000;
  color:#fff;
}

.header {
  position: sticky;
  top:0;
  background:#000;
  padding:15px;
  z-index:999;
}

.title {
  color:#ff4d6d;
  font-size:22px;
  font-weight:bold;
}

.search {
  margin-top:10px;
}

.search input {
  width:100%;
  padding:12px;
  border-radius:20px;
  border:none;
  background:#111;
  color:#fff;
}

.grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:12px;
}

.card {
  background:#111;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
}

.card img {
  width:100%;
  height:200px;
  object-fit:cover;
}

.card p {
  padding:10px;
  font-size:14px;
}

.loading {
  text-align:center;
  padding:30px;
}
</style>
</head>

<body>

<div class="header">
  <div class="title">Asupanmu</div>
  <div class="search">
    <input type="text" id="search" placeholder="Cari video...">
  </div>
</div>

<div id="videoList" class="grid"></div>
<div id="loading" class="loading">Loading...</div>

<script>
let allVideos = []

async function loadVideos() {
  try {
    const res = await fetch("/api/videos", {
      cache: "force-cache" // 🚀 SUPER CEPAT
    })

    const data = await res.json()
    allVideos = data

    render(data)
    document.getElementById("loading").style.display = "none"

  } catch (e) {
    document.getElementById("loading").innerText = "Gagal load data"
  }
}

function render(videos) {
  const el = document.getElementById("videoList")
  el.innerHTML = ""

  videos.forEach(v => {
    const div = document.createElement("div")
    div.className = "card"

    div.innerHTML = `
      <img src="${v.thumbnail}" loading="lazy">
      <p>${v.title}</p>
    `

    div.onclick = () => {
      window.open(v.url, "_blank") // ✅ langsung ke halaman asli
    }

    el.appendChild(div)
  })
}

// 🔍 SEARCH
document.getElementById("search").addEventListener("input", e => {
  const key = e.target.value.toLowerCase()

  const filtered = allVideos.filter(v =>
    v.title.toLowerCase().includes(key)
  )

  render(filtered)
})

loadVideos()
</script>

</body>
</html>
