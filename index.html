<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streaming Fast</title>

<style>
body {
  margin: 0;
  background: #0f0f0f;
  font-family: sans-serif;
  color: white;
}

/* SEARCH */
.search {
  padding: 10px;
}

.search input {
  width: 100%;
  padding: 12px;
  border-radius: 20px;
  border: none;
  background: #1c1c1c;
  color: white;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 10px;
}

.card {
  position: relative;
  border-radius: 15px;
  overflow: hidden;
  cursor: pointer;
  background: #222;
}

.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

/* TITLE */
.overlay {
  position: absolute;
  bottom: 0;
  padding: 8px;
  font-size: 14px;
  width: 100%;
  background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
}

/* LOADING */
.loading {
  text-align: center;
  padding: 20px;
  font-size: 14px;
  opacity: 0.7;
}
</style>
</head>

<body>

<div class="search">
  <input type="text" id="search" placeholder="Search video...">
</div>

<div class="grid" id="videos"></div>

<div class="loading" id="loading">Loading...</div>

<script>
let page = 1;
let loading = false;
let allLoaded = false;
let allVideos = [];
const limit = 20;

/* LOAD VIDEOS */
async function loadVideos() {
  if (loading || allLoaded) return;

  loading = true;
  document.getElementById("loading").innerText = "Loading...";

  try {
    const res = await fetch(`/api/videos?page=${page}`);
    const data = await res.json();

    if (!data.videos || data.videos.length === 0) {
      allLoaded = true;
      document.getElementById("loading").innerText = "No more videos";
      return;
    }

    allVideos = allVideos.concat(data.videos);
    render(data.videos);

    // 🔥 cek total biar akurat
    if ((page * limit) >= data.total) {
      allLoaded = true;
      document.getElementById("loading").innerText = "All videos loaded";
    }

    page++;

  } catch (err) {
    console.log(err);
  }

  loading = false;
}

/* RENDER */
function render(videos) {
  const container = document.getElementById("videos");

  videos.forEach(v => {
    container.innerHTML += `
      <div class="card" onclick="play('${v.filecode}')">
        <img src="${v.thumbnail}" loading="lazy">
        <div class="overlay">${v.title || 'No Title'}</div>
      </div>
    `;
  });
}

/* INFINITE SCROLL */
window.addEventListener("scroll", () => {
  if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200) {
    loadVideos();
  }
});

/* PLAY */
function play(code) {
  window.open("https://vidara.to/v/" + code, "_blank");
}

/* SEARCH */
document.getElementById("search").addEventListener("input", function() {
  const keyword = this.value.toLowerCase();

  const filtered = allVideos.filter(v =>
    (v.title || "").toLowerCase().includes(keyword)
  );

  document.getElementById("videos").innerHTML = "";
  render(filtered);
});

/* INIT */
loadVideos();
</script>

</body>
</html>
