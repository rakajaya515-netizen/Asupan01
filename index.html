<!DOCTYPE html>
<html>
<head>
  <title>Streaming Video</title>
</head>
<body>

<h1>_𝘼𝙨𝙪𝙥𝙖𝙣 𝙏𝙚𝙧𝙚𝙣𝙖𝙠_</h1>
<div id="videos"></div>

<script>
fetch("https://api.vidara.com/videos", {
  headers: {
    "Authorization": "Bearer API_KEY_KAMU"
  }
})
.then(res => res.json())
.then(data => {
  const container = document.getElementById("videos");

  data.forEach(video => {
    const el = document.createElement("video");
    el.src = video.url;
    el.controls = true;
    el.width = 300;
    container.appendChild(el);
  });
});
</script>

</body>
</html>
