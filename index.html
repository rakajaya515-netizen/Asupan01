<!DOCTYPE html>
<html>
<head>
  <title>Asupanmu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: black;
      color: white;
      font-family: sans-serif;
      padding: 15px;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 2px solid orange;
      margin-bottom: 15px;
    }

    #videoList {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .video img {
      width: 100%;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<h1>Asupanmu</h1>

<input id="search" placeholder="Cari video...">

<div id="videoList"></div>

<script src="script.js"></script>

</body>
</html>
