<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asupanmu</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #000;
  color: #fff;
}

/* HEADER */
h1 {
  padding: 15px;
  margin: 0;
}

/* SEARCH */
#search {
  width: calc(100% - 30px);
  margin: 10px 15px;
  padding: 12px;
  border-radius: 10px;
  border: 2px solid orange;
  font-size: 16px;
}

/* GRID */
#videoList {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 10px;
}

/* CARD */
.video {
  background: #111;
  border-radius: 12px;
  overflow: hidden;
}

.video img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  cursor: pointer;
}

.video p {
  margin: 8px;
  font-size: 14px;
}

/* MODAL PLAYER */
#modal {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  background: black;
  z-index: 999;
}

#modal iframe {
  width: 100%;
  height: 100%;
  border: none;
}

#closeBtn {
  position: absolute;
  top: 15px;
  right: 20px;
  font-size: 30px;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>Asupanmu</h1>

<input type="text" id="search" placeholder="Cari video...">

<div id="videoList">Loading...</div>

<!-- MODAL -->
<div id="modal">
  <div id="closeBtn" onclick="closeVideo()">✕</div>
  <iframe id="player"></iframe>
</div>

<script>
let allVideos = []

async function loadVideos() {
  const container = document.getElementById("videoList")

  try {
    const res = await fetch("/api/videos")
    const json = await res.json()

    // 🔥 FIX STRUCTURE API KAMU
    if (json.result && json.result.videos) {
      allVideos = json.result.videos
    } else {
      container.innerHTML = "Format API tidak sesuai"
      return
    }

    renderVideos(allVideos)

  } catch (err) {
    container.innerHTML = "Error load: " + err.message
  }
}

function renderVideos(videos) {
  const container = document.getElementById("videoList")

  if (!videos.length) {
    container.innerHTML = "Tidak ada video"
    return
  }

  container.innerHTML = ""

  videos.forEach(v => {
    const div = document.createElement("div")
    div.className = "video"

    const title = v.title || "No Title"

    div.innerHTML = `
      <img src="${v.thumbnail}" onclick="openVideo('${v.link}')">
      <p>${title}</p>
    `

    container.appendChild(div)
  })
}

/* OPEN PLAYER */
function openVideo(url) {
  document.getElementById("modal").style.display = "block"
  document.getElementById("player").src = url
}

/* CLOSE PLAYER */
function closeVideo() {
  document.getElementById("modal").style.display = "none"
  document.getElementById("player").src = ""
}

/* SEARCH */
document.getElementById("search").addEventListener("input", function(e) {
  const keyword = e.target.value.toLowerCase()

  const filtered = allVideos.filter(v => {
    return (v.title || "").toLowerCase().includes(keyword)
  })

  renderVideos(filtered)
})

/* LOAD */
loadVideos()
</script>

</body>
</html>
