<div id="videos"></div>

<script>
fetch("https://asupan01.vercel.app/api/videos")
  .then(res => res.json())
  .then(data => {
    const container = document.getElementById("videos");

    data.forEach(video => {
      const el = document.createElement("video");
      el.src = video.url;
      el.controls = true;
      el.width = 300;
      container.appendChild(el);
    });
