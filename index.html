<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  margin: 0;
  background: #000;
  font-family: sans-serif;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 10px;
}

.card {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
}

.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.overlay {
  position: absolute;
  bottom: 0;
  padding: 10px;
  color: white;
  background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
}

/* 🔥 PLAYER MODAL */
#playerModal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  display: none;
  justify-content: center;
  align-items: center;
}

#playerModal video {
  width: 100%;
  height: auto;
}

.close {
  position: absolute;
  top: 20px;
  right: 20px;
  font-size: 30px;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="grid" id="videos"></div>

<!-- 🔥 PLAYER -->
<div id="playerModal">
  <span class="close" onclick="closePlayer()">✖</span>
  <video id="player" controls autoplay></video>
</div>

<script>
async function loadVideos() {
  const res = await fetch("/api/videos");
  const data = await res.json();

  const container = document.getElementById("videos");

  data.videos.forEach(v => {
    container.innerHTML += `
      <div class="card" onclick="play('${v.video}')">
        <img src="${v.thumbnail}">
        <div class="overlay">${v.title}</div>
      </div>
    `;
  });
}

function play(url) {
  document.getElementById("playerModal").style.display = "flex";

  // 🔥 coba langsung
  document.getElementById("player").src = url;
}

function closePlayer() {
  const video = document.getElementById("player");
  video.pause();
  video.src = "";
  document.getElementById("playerModal").style.display = "none";
}

loadVideos();
</script>

</body>
</html>
