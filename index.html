  <!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  margin:0;
  background:#000;
  color:#fff;
  font-family:sans-serif;
}

.search {
  padding:10px;
}
.search input {
  width:100%;
  padding:12px;
  border-radius:20px;
  border:none;
}

.grid {
  display:grid;
  grid-template-columns: repeat(2,1fr);
  gap:10px;
  padding:10px;
}

.card {
  border-radius:12px;
  overflow:hidden;
  background:#111;
}

.card img {
  width:100%;
  height:200px;
  object-fit:cover;
}

.overlay {
  padding:8px;
  font-size:14px;
}

/* MODAL */
#modal {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#000;
  display:none;
  z-index:999;
}

#player {
  width:100%;
  height:100%;
}

#close {
  position:absolute;
  top:10px;
  right:15px;
  font-size:24px;
  color:#fff;
  z-index:1000;
}
</style>
</head>

<body>

<div class="search">
  <input id="searchInput" placeholder="Search video...">
</div>

<div class="grid" id="videos"></div>

<div id="modal">
  <div id="close" onclick="closePlayer()">✕</div>
  <video id="player" controls autoplay></video>
</div>

<script>
let allVideos = [];

async function loadVideos() {
  try {
    const res = await fetch("/api/videos");
    const data = await res.json();

    console.log(data); // DEBUG

    allVideos = data.videos || [];
    renderVideos(allVideos);

  } catch (e) {
    console.log("ERROR:", e);
  }
}

function renderVideos(videos) {
  const container = document.getElementById("videos");
  container.innerHTML = "";

  if (!videos.length) {
    container.innerHTML = "<p>No videos</p>";
    return;
  }

  videos.forEach(v => {
    container.innerHTML += `
      <div class="card" onclick="play('${v.filecode}')">
        <img src="${v.thumbnail}">
        <div class="overlay">${v.title}</div>
      </div>
    `;
  });
}

function play(code) {
  const modal = document.getElementById("modal");
  const player = document.getElementById("player");

  modal.style.display = "block";

  // DIRECT STREAM (lebih cepat dari embed)
  player.src = `https://vidara.to/e/${code}`;
}

function closePlayer() {
  document.getElementById("modal").style.display = "none";
  document.getElementById("player").src = "";
}

document.getElementById("searchInput").addEventListener("input", function() {
  const key = this.value.toLowerCase();
  const filtered = allVideos.filter(v =>
    (v.title || "").toLowerCase().includes(key)
  );
  renderVideos(filtered);
});

loadVideos();
</script>

</body>
</html>
