<!DOCTYPE html>
<html>
<head>
  <title>Video App</title>

  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      font-family: Arial;
      color: white;
    }

    .search {
      padding: 10px;
    }

    .search input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      background: #1c1c1c;
      color: white;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 10px;
    }

    .card {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .overlay-text {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      font-size: 14px;
      font-weight: bold;
    }

    /* MODAL PLAYER */
    #modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      display: none;
      z-index: 999;
    }

    #player {
      width: 100%;
      height: 100%;
      border: none;
    }

    #closeBtn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 25px;
      color: white;
      cursor: pointer;
      z-index: 1000;
    }
  </style>
</head>

<body>

  <!-- SEARCH -->
  <div class="search">
    <input type="text" id="searchInput" placeholder="Search...">
  </div>

  <!-- GRID -->
  <div class="grid" id="videos"></div>

  <!-- MODAL PLAYER -->
  <div id="modal">
    <div id="closeBtn" onclick="closePlayer()">✕</div>
    <iframe id="player"></iframe>
  </div>

  <script>
    let allVideos = [];

    async function loadVideos() {
      try {
        const res = await fetch("/api/videos");
        const data = await res.json();

        allVideos = data.result.videos;
        renderVideos(allVideos);

      } catch (err) {
        console.log("Error:", err);
      }
    }

    function renderVideos(videos) {
      const container = document.getElementById("videos");
      container.innerHTML = "";

      videos.forEach(v => {
        container.innerHTML += `
          <div class="card" onclick="play('${v.filecode}')">
            <img src="${v.thumbnail}">
            <div class="overlay-text">
              ${v.title || 'No Title'}
            </div>
          </div>
        `;
      });
    }

    function play(code) {
      const modal = document.getElementById("modal");
      const player = document.getElementById("player");

      player.src = "https://vidara.so/e/" + code;
      modal.style.display = "block";
    }

    function closePlayer() {
      const modal = document.getElementById("modal");
      const player = document.getElementById("player");

      modal.style.display = "none";
      player.src = "";
    }

    // SEARCH FUNCTION
    document.getElementById("searchInput").addEventListener("input", function() {
      const keyword = this.value.toLowerCase();

      const filtered = allVideos.filter(v =>
        (v.title || "").toLowerCase().includes(keyword)
      );

      renderVideos(filtered);
    });

    loadVideos();
  </script>

</body>
</html>
