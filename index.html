<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Asupanmu</title>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:sans-serif;
}

.header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#000;
  padding:12px;
  border-bottom:1px solid #111;
}

.logo{
  font-size:24px;
  font-weight:bold;
  margin-bottom:10px;
}

.search{
  width:100%;
  padding:12px;
  border-radius:15px;
  border:none;
  background:#111;
  color:#fff;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:10px;
}

.card{
  border-radius:16px;
  overflow:hidden;
  background:#111;
}

.card img{
  width:100%;
  height:260px;
  object-fit:cover;
}

.title{
  padding:8px;
  font-size:13px;
}

</style>
</head>

<body>

<div class="header">
  <div class="logo">Asupanmu</div>
  <input id="search" class="search" placeholder="Cari video..."/>
</div>

<div class="grid" id="grid"></div>

<script>
let allVideos = []
let visible = 20
let filtered = []

async function loadAll() {
  const api = await fetch('/api/videos')
  const apiData = await api.json()

  const vizey = await fetch('/vizey.json')
  const vizeyData = await vizey.json()

  const vizeyFormatted = vizeyData.map(v => ({
    ...v,
    source: "vizey"
  }))

  allVideos = [
    ...apiData.result.videos,
    ...vizeyFormatted
  ].sort(() => Math.random() - 0.5)

  filtered = allVideos
  render()
}

function getLink(v){
  if(v.source === 'vidara'){
    return `https://vidara.so/v/${v.filecode}`
  }
  if(v.source === 'vizey'){
    return `https://vizey.co/v/${v.filecode}`
  }
}

function render(){
  const grid = document.getElementById('grid')

  const slice = filtered.slice(0, visible)

  grid.innerHTML = slice.map(v => `
    <a href="${getLink(v)}" target="_blank" style="color:white;text-decoration:none">
      <div class="card">
        <img loading="lazy" src="${v.thumbnail}">
        <div class="title">${v.title}</div>
      </div>
    </a>
  `).join('')
}

window.addEventListener('scroll', () => {
  if(window.innerHeight + window.scrollY >= document.body.offsetHeight - 200){
    visible += 20
    render()
  }
})

document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase()

  filtered = allVideos.filter(v =>
    v.title.toLowerCase().includes(q)
  )

  visible = 20
  render()
})

loadAll()
</script>

</body>
</html>
