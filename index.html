<<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streaming Pro</title>

<style>
body {
  margin: 0;
  background: #0f0f0f;
  font-family: sans-serif;
  color: white;
}

.search {
  padding: 15px;
}

.search input {
  width: 100%;
  padding: 12px;
  border-radius: 20px;
  border: none;
  background: #1c1c1c;
  color: white;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 10px;
}

.card {
  position: relative;
  border-radius: 18px;
  overflow: hidden;
  cursor: pointer;
}

.card img {
  width: 100%;
  height: 220px;
  object-fit: cover;
}

.overlay {
  position: absolute;
  bottom: 0;
  padding: 10px;
  width: 100%;
  background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
}

/* MODAL */
#modal {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  display:none;
  z-index:999;
}

#player {
  width:100%;
  height:100%;
  border:none;
}

#close {
  position:absolute;
  top:15px;
  right:20px;
  font-size:25px;
  cursor:pointer;
  z-index:1000;
}

/* LOADING */
#loading {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  font-size:20px;
}
</style>
</head>

<body>

<div class="search">
  <input type="text" id="searchInput" placeholder="Search...">
</div>

<div class="grid" id="videos"></div>

<!-- MODAL -->
<div id="modal">
  <div id="close" onclick="closePlayer()">✕</div>
  <div id="loading">Loading...</div>
  <iframe id="player"></iframe>
</div>

<script>
let allVideos = [];

async function loadVideos() {
  const res = await fetch("/api/videos");
  const data = await res.json();

  allVideos = data.result.videos;
  renderVideos(allVideos);
}

function renderVideos(videos) {
  const container = document.getElementById("videos");
  container.innerHTML = "";

  videos.forEach(v => {
    container.innerHTML += `
      <div class="card" onclick="play('${v.filecode}')">
        <img src="${v.thumbnail}">
        <div class="overlay">
          ${v.title || 'No Title'}
        </div>
      </div>
    `;
  });
}

function play(code) {
  const modal = document.getElementById("modal");
  const player = document.getElementById("player");
  const loading = document.getElementById("loading");

  modal.style.display = "block";
  loading.style.display = "block";

  // coba embed ringan
  player.src = "https://vidara.to/v/" + code;

  player.onload = () => {
    loading.style.display = "none";
  };

  // fallback kalau gagal
  setTimeout(() => {
    if (loading.style.display === "block") {
      window.open("https://vidara.to/v/" + code, "_blank");
    }
  }, 5000);
}

function closePlayer() {
  document.getElementById("modal").style.display = "none";
  document.getElementById("player").src = "";
}

document.getElementById("searchInput").addEventListener("input", function() {
  const keyword = this.value.toLowerCase();

  const filtered = allVideos.filter(v =>
    (v.title || "").toLowerCase().includes(keyword)
  );

  renderVideos(filtered);
});

loadVideos();
</script>

</body>
</html>
