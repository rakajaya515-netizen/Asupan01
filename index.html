<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asupanmu</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #000;
  color: #fff;
}

h1 {
  padding: 15px;
  margin: 0;
}

#search {
  width: calc(100% - 30px);
  margin: 10px 15px;
  padding: 12px;
  border-radius: 10px;
  border: 2px solid orange;
}

/* GRID 2 KOLOM */
#videoList {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 10px;
}

.video {
  background: #111;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
}

.video img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.video p {
  padding: 8px;
  font-size: 14px;
}
</style>
</head>

<body>

<h1>Asupanmu</h1>

<input type="text" id="search" placeholder="Cari video...">

<div id="videoList">Loading...</div>

<script>
let allVideos = []

async function loadVideos() {
  const container = document.getElementById("videoList")

  try {
    const res = await fetch("/api/videos")
    const json = await res.json()

    // 🔥 FIX STRUCTURE API
    if (json.result && json.result.videos) {
      allVideos = json.result.videos
    } else {
      container.innerHTML = "Format API tidak sesuai"
      return
    }

    renderVideos(allVideos)

  } catch (err) {
    container.innerHTML = "Error: " + err.message
  }
}

function renderVideos(videos) {
  const container = document.getElementById("videoList")

  if (!videos.length) {
    container.innerHTML = "Tidak ada video"
    return
  }

  container.innerHTML = ""

  videos.forEach(v => {
    const div = document.createElement("div")
    div.className = "video"

    const title = v.title || "No Title"

    div.innerHTML = `
      <img src="${v.thumbnail}">
      <p>${title}</p>
    `

    // 🔥 INI KUNCINYA
    div.onclick = () => {
      window.location.href = v.link
    }

    container.appendChild(div)
  })
}

/* SEARCH */
document.getElementById("search").addEventListener("input", function(e) {
  const keyword = e.target.value.toLowerCase()

  const filtered = allVideos.filter(v =>
    (v.title || "").toLowerCase().includes(keyword)
  )

  renderVideos(filtered)
})

loadVideos()
</script>

</body>
</html>
