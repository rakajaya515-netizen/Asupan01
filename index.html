<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Asupanmu</title>

  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      color: #fff;
      font-family: Arial;
    }

    h1 {
      padding: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 10px;
    }

    .card {
      background: #1a1a1a;
      border-radius: 10px;
      overflow: hidden;
    }

    .thumb {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background: #222;
    }

    .title {
      padding: 8px;
      font-size: 13px;
      color: #ccc;
    }

    .loader {
      text-align: center;
      padding: 20px;
      color: #888;
    }
  </style>
</head>

<body>

<h1>Asupanmu</h1>

<div id="videos" class="grid"></div>
<div id="loader" class="loader">Loading...</div>

<script>
let page = 0
const limit = 20
let allVideos = []
let loading = false

// =======================
// LOAD API
// =======================
async function loadVideos() {
  try {
    const res = await fetch("/api/videos")
    const data = await res.json()

    allVideos = data.result.videos || []

    render()
  } catch (err) {
    document.getElementById("loader").innerText = "Gagal load"
  }
}

// =======================
// FIX THUMBNAIL
// =======================
function getThumbnail(v) {
  // VIZEY fallback
  if (v.source === "vizey") {
    if (!v.thumbnail || v.thumbnail.includes("cdn.vizey")) {
      return `https://vidgif.com/image/${v.filecode}.jpg`
    }
  }

  return v.thumbnail
}

// =======================
// FIX LINK
// =======================
function getLink(v) {
  if (v.source === "vizey") {
    return `https://vizey.co/view/${v.filecode}`
  } else {
    return v.link || `https://vidara.to/${v.filecode}`
  }
}

// =======================
// RENDER
// =======================
function render() {
  if (loading) return
  loading = true

  const container = document.getElementById("videos")

  const start = page * limit
  const end = start + limit

  const slice = allVideos.slice(start, end)

  if (slice.length === 0) {
    document.getElementById("loader").innerText = "Tidak ada video"
    return
  }

  slice.forEach(v => {
    const div = document.createElement("div")
    div.className = "card"

    const thumb = getThumbnail(v)
    const link = getLink(v)

    div.innerHTML = `
      <a href="${link}" target="_blank">
        <img class="thumb" src="${thumb}" 
          onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'"/>
        <div class="title">${v.title}</div>
      </a>
    `

    container.appendChild(div)
  })

  page++
  loading = false
}

// =======================
// SCROLL LOAD
// =======================
window.addEventListener("scroll", () => {
  if (
    window.innerHeight + window.scrollY >=
    document.body.offsetHeight - 200
  ) {
    render()
  }
})

loadVideos()
</script>

</body>
</html>
