<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Grid</title>

<style>
body {
  background:#0f0f0f;
  color:white;
  font-family:sans-serif;
}

.search {
  width:100%;
  padding:10px;
  border-radius:10px;
  border:none;
  margin:15px 0;
}

.grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.card {
  background:#1c1c1c;
  border-radius:12px;
  overflow:hidden;
}

.card video {
  width:100%;
  height:200px;
  object-fit:cover;
}

.title {
  padding:8px;
  font-size:13px;
}
</style>
</head>

<body>

<input class="search" placeholder="Search video...">

<div class="grid">

  <div class="card">
    <video src="https://www.w3schools.com/html/mov_bbb.mp4" controls></video>
    <div class="title">Sample Video 1</div>
  </div>

  <div class="card">
    <video src="https://www.w3schools.com/html/movie.mp4" controls></video>
    <div class="title">Sample Video 2</div>
  </div>

</div>

</body>
</html>
