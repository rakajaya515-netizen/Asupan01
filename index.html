<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asupanmu</title>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial, sans-serif;
}

.header{
  position:sticky;
  top:0;
  z-index:999;
  background:#000;
  padding:14px 12px 10px;
  border-bottom:1px solid #111;
}

.logo{
  font-size:28px;
  font-weight:bold;
  margin-bottom:10px;
}

.search{
  width:100%;
  padding:14px;
  border-radius:18px;
  border:none;
  outline:none;
  background:#111;
  color:#fff;
  font-size:16px;
  box-sizing:border-box;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:12px;
  padding:14px 12px 40px;
}

.card{
  position:relative;
  border-radius:20px;
  overflow:hidden;
  background:#111;
  cursor:pointer;
}

.card img{
  width:100%;
  height:280px;
  object-fit:cover;
  display:block;
}

.overlay{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:14px;
  background:linear-gradient(transparent, rgba(0,0,0,.9));
  font-size:14px;
  font-weight:bold;
}

@media(max-width:480px){
  .card img{
    height:250px;
  }
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">Asupanmu</div>
  <input
    type="text"
    id="search"
    class="search"
    placeholder="Search..."
  />
</div>

<div class="grid" id="videos"></div>

<script>
let allVideos = []

async function loadVideos() {
  const res = await fetch('/api/videos')
  const data = await res.json()

  allVideos = data.result.videos || []
  renderVideos(allVideos)
}

function renderVideos(videos) {
  const container = document.getElementById('videos')

  container.innerHTML = videos.map(video => {
    let link = '#'

    if (video.source === 'vidara') {
      link = `https://vidara.so/v/${video.filecode}`
    }

    if (video.source === 'vizey') {
      link = `https://vizey.com/v/${video.filecode}`
    }

    return `
      <a href="${link}" target="_blank" style="text-decoration:none;color:white">
        <div class="card">
          <img loading="lazy" src="${video.thumbnail}" alt="${video.title}">
          <div class="overlay">${video.title}</div>
        </div>
      </a>
    `
  }).join('')
}

document.getElementById('search').addEventListener('input', function(e) {
  const q = e.target.value.toLowerCase()

  const filtered = allVideos.filter(v =>
    v.title.toLowerCase().includes(q)
  )

  renderVideos(filtered)
})

loadVideos()
</script>

</body>
</html>
