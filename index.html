<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asupanmu</title>

<style>
  body {
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 15px;
  }

  h1 {
    margin-bottom: 10px;
  }

  input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    margin-bottom: 15px;
    font-size: 16px;
  }

  /* GRID */
  #videoList {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
  }

  .video {
    cursor: pointer;
  }

  .video img {
    width: 100%;
    border-radius: 10px;
  }

  .title {
    font-size: 14px;
    margin-top: 5px;
  }

  .error {
    color: red;
  }

  /* PLAYER MODAL */
  #playerModal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    z-index: 999;
  }

  #playerModal span {
    position: absolute;
    top: 10px;
    right: 20px;
    font-size: 30px;
    color: white;
    cursor: pointer;
  }

  iframe {
    width: 100%;
    height: 100%;
  }
</style>
</head>

<body>

<h1>Asupanmu</h1>

<input type="text" id="search" placeholder="Cari video...">

<div id="videoList">Loading...</div>

<!-- PLAYER -->
<div id="playerModal">
  <span onclick="closePlayer()">✕</span>
  <iframe id="playerFrame" frameborder="0" allowfullscreen></iframe>
</div>

<script>
let allVideos = []

async function loadVideos() {
  const container = document.getElementById("videoList")

  try {
    const res = await fetch("/api/videos")
    const data = await res.json()

    console.log("DATA:", data)

    // ✅ FIX FORMAT API
    if (data.result && Array.isArray(data.result.videos)) {
      allVideos = data.result.videos
    } else {
      container.innerHTML = `
        <div class="error">
          Format tidak dikenali
          <pre>${JSON.stringify(data, null, 2)}</pre>
        </div>
      `
      return
    }

    renderVideos(allVideos)

  } catch (err) {
    container.innerHTML = "<div class='error'>Error load</div>"
    console.error(err)
  }
}

function renderVideos(videos) {
  const container = document.getElementById("videoList")

  if (!videos.length) {
    container.innerHTML = "Tidak ada video"
    return
  }

  container.innerHTML = videos.map(v => `
    <div class="video" onclick="openPlayer('${v.filecode}')">
      <img src="${v.thumbnail}">
      <div class="title">${v.title}</div>
    </div>
  `).join("")
}

// 🔍 SEARCH
document.getElementById("search").addEventListener("input", function(e) {
  const keyword = e.target.value.toLowerCase()

  const filtered = allVideos.filter(v =>
    (v.title || "").toLowerCase().includes(keyword)
  )

  renderVideos(filtered)
})

// 🎬 PLAYER
function openPlayer(code) {
  const modal = document.getElementById("playerModal")
  const frame = document.getElementById("playerFrame")

  frame.src = `https://vidara.to/embed-${code}.html`
  modal.style.display = "block"
}

function closePlayer() {
  const modal = document.getElementById("playerModal")
  const frame = document.getElementById("playerFrame")

  frame.src = ""
  modal.style.display = "none"
}

loadVideos()
</script>

</body>
</html>
