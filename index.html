<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asupanmu</title>

<style>
body {
  background:#000;
  color:#fff;
  margin:0;
  font-family:sans-serif;
}

h1 { padding:15px; }

#search {
  width:90%;
  margin:10px;
  padding:12px;
  border-radius:10px;
  border:2px solid orange;
}

.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:10px;
}

.video img {
  width:100%;
  border-radius:10px;
}

.video p {
  font-size:12px;
}

.ads { text-align:center; }
</style>
</head>

<body>

<h1>Asupanmu</h1>

<div class="ads">
  <button onclick="iklan()">🔥 Paling di cari 🔥</button>
</div>

<input id="search" placeholder="Cari video...">

<div id="list" class="grid"></div>

<script>
let data = []
let page = 0
let limit = 12
let iklanDone = false

// IKLAN 1x
function iklan(){
  if(!iklanDone){
    window.open("https://www.profitablecpmratenetwork.com/s6szeryj1j?key=67a910e3b4387aa420b25f4a4bfa41b1","_blank")
    iklanDone = true
  }
}

// LOAD API
async function load(){
  const res = await fetch("/api/videos")
  const json = await res.json()

  data = json.videos || []
  render()
}

// RENDER
function render(){
  const list = document.getElementById("list")

  const start = page * limit
  const end = start + limit

  const slice = data.slice(start, end)

  slice.forEach(v=>{
    const div = document.createElement("div")

    div.innerHTML = `
      <img loading="lazy" src="${v.thumbnail}">
      <p>${v.title}</p>
    `

    div.onclick = ()=>play(v.filecode, v.source)

    list.appendChild(div)
  })

  page++
}

// PLAY
function play(id, src){
  if(src==="vidara"){
    location.href = `https://vidara.so/v/${id}`
  }else if(src==="dood"){
    location.href = `https://doodstream.com/d/${id}`
  }else{
    location.href = `https://vizey.com/d/${id}`
  }
}

// INFINITE SCROLL
window.addEventListener("scroll", ()=>{
  if(window.innerHeight + window.scrollY >= document.body.offsetHeight - 200){
    render()
  }
})

// SEARCH
document.getElementById("search").addEventListener("input", e=>{
  const val = e.target.value.toLowerCase()

  const filtered = data.filter(v =>
    v.title.toLowerCase().includes(val)
  )

  document.getElementById("list").innerHTML = ""
  page = 0
  data = filtered
  render()
})

load()
</script>

</body>
</html>
