<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asupanmu01</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #0f0f0f;
  color: white;
}

/* HEADER */
header {
  padding: 15px;
}

header h1 {
  font-size: 20px;
  font-weight: bold;
}

.search-box {
  margin-top: 10px;
}

.search-box input {
  width: 100%;
  padding: 12px;
  border-radius: 25px;
  border: none;
  outline: none;
  background: #1c1c1c;
  color: white;
}

/* GRID */
#video-list {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 10px;
}

/* CARD */
.card {
  position: relative;
  cursor: pointer;
}

.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-radius: 12px;
}

.title {
  position: absolute;
  bottom: 8px;
  left: 8px;
  right: 8px;
  font-size: 13px;
  font-weight: bold;
  background: rgba(0,0,0,0.5);
  padding: 5px;
  border-radius: 6px;
}

/* LOADING */
.loading {
  text-align: center;
  padding: 20px;
  color: gray;
}
</style>

</head>
<body>

<header>
  <h1>Asupanmu01</h1>

  <div class="search-box">
    <input type="text" id="search" placeholder="Search video...">
  </div>
</header>

<main id="video-list"></main>
<div class="loading" id="loading">Loading...</div>

<script>
const container = document.getElementById("video-list");
const searchInput = document.getElementById("search");

let allVideos = [];

/* =========================
   GANTI API DI SINI
========================= */
const API_URL = "/api/videos";

/* =========================
   FETCH DATA
========================= */
async function loadVideos() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();

    // format harus seperti ini:
    // [{title, thumbnail, video_url}]
    allVideos = data;

    renderVideos(allVideos);
  } catch (err) {
    document.getElementById("loading").innerText = "Gagal load API";
    console.error(err);
  }
}

/* =========================
   RENDER VIDEO
========================= */
function renderVideos(videos) {
  container.innerHTML = "";

  videos.forEach(video => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <img src="${video.thumbnail}" loading="lazy">
      <div class="title">${video.title}</div>
    `;

    div.onclick = () => {
      // redirect ke player
      window.location.href = "player.html?url=" + encodeURIComponent(video.video_url);
    };

    container.appendChild(div);
  });

  document.getElementById("loading").style.display = "none";
}

/* =========================
   SEARCH
========================= */
searchInput.addEventListener("input", () => {
  const keyword = searchInput.value.toLowerCase();

  const filtered = allVideos.filter(v =>
    v.title.toLowerCase().includes(keyword)
  );

  renderVideos(filtered);
});

/* =========================
   INIT
========================= */
loadVideos();
</script>

</body>
</html>
