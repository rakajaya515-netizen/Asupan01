<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Asupanmu</title>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: sans-serif;
}

/* HEADER */
.header {
  position: sticky;
  top: 0;
  background: #000;
  padding: 10px;
  z-index: 999;
}

/* SEARCH */
.search {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
}

/* GRID 2 KOLOM */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 10px;
}

/* CARD */
.card {
  background: #111;
  border-radius: 12px;
  overflow: hidden;
}

.card img {
  width: 100%;
  height: 220px;
  object-fit: cover;
}

.title {
  padding: 8px;
  font-size: 14px;
}

</style>
</head>

<body>

<div class="header">
  <input id="search" class="search" placeholder="Cari video..." />
</div>

<div id="grid" class="grid"></div>

<script>
let allVideos = []
let page = 0
const perPage = 20

// =========================
// 🔥 FETCH API
// =========================
async function loadData() {
  const res = await fetch('/api/videos')
  const json = await res.json()

  allVideos = json.videos
  render()
}

// =========================
// 🔥 RENDER
// =========================
function render() {
  const grid = document.getElementById('grid')

  const start = page * perPage
  const end = start + perPage

  const items = allVideos.slice(start, end)

  items.forEach(v => {
    const div = document.createElement('div')
    div.className = 'card'

    div.innerHTML = `
      <img loading="lazy" src="${v.thumbnail}" />
      <div class="title">${v.title}</div>
    `

    div.onclick = () => {
      if (v.source === 'vidara') {
        window.open(`https://vidara.so/v/${v.filecode}`)
      } else {
        window.open(`https://vizey.co/view/${v.filecode}`)
      }
    }

    grid.appendChild(div)
  })
}

// =========================
// 🔥 INFINITE SCROLL
// =========================
window.addEventListener('scroll', () => {
  if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
    page++
    render()
  }
})

// =========================
// 🔥 SEARCH
// =========================
document.getElementById('search').addEventListener('input', (e) => {
  const val = e.target.value.toLowerCase()

  document.getElementById('grid').innerHTML = ''

  allVideos = allVideos.filter(v =>
    v.title.toLowerCase().includes(val)
  )

  page = 0
  render()
})

// START
loadData()
</script>

</body>
</html>
