<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asupanmu</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #0b0b0b;
  font-family: 'Poppins', sans-serif;
  color: #fff;
}

/* NAVBAR */
.navbar {
  position: sticky;
  top: 0;
  z-index: 999;
  padding: 14px 16px;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

.navbar h1 {
  font-size: 20px;
  font-weight: 600;
  background: linear-gradient(90deg, #ff4d6d, #ff9a3c);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* SEARCH BAR */
.search-box {
  position: sticky;
  top: 58px; /* di bawah navbar */
  z-index: 998;
  padding: 10px 12px;
  background: #0b0b0b;
}

.search-box input {
  width: 100%;
  padding: 10px 14px;
  border-radius: 12px;
  border: none;
  outline: none;
  font-size: 14px;
  background: #1a1a1a;
  color: #fff;
}

/* GRID */
.container {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  padding: 12px;
}

/* CARD */
.card {
  position: relative;
  border-radius: 16px;
  overflow: hidden;
  background: #111;
  cursor: pointer;
  transition: 0.25s;
}

.card:hover {
  transform: scale(1.03);
}

.card img {
  width: 100%;
  height: 260px;
  object-fit: cover;
}

/* TITLE */
.title {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 12px;
  font-size: 13px;
  line-height: 1.3;
  background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
}

/* LOADING */
.loading {
  text-align: center;
  padding: 20px;
  opacity: 0.7;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <h1>Asupanmu</h1>
</div>

<!-- SEARCH -->
<div class="search-box">
  <input type="text" id="search" placeholder="Cari video...">
</div>

<!-- CONTENT -->
<div id="videoList" class="container"></div>
<div id="loading" class="loading">Loading...</div>

<script>
let allVideos = [];

/* LOAD DATA */
async function loadVideos() {
  const loading = document.getElementById("loading");

  try {
    const res = await fetch("/api/videos");
    const data = await res.json();

    allVideos = data || [];

    if (allVideos.length === 0) {
      loading.innerText = "Tidak ada video";
      return;
    }

    renderVideos(allVideos);
    loading.style.display = "none";

  } catch (err) {
    loading.innerText = "Gagal load data";
    console.error(err);
  }
}

/* RENDER */
function renderVideos(videos) {
  const container = document.getElementById("videoList");
  container.innerHTML = "";

  videos.forEach(v => {
    let url = "#";

    if (v.source === "vidara") {
      url = `https://vidara.so/v/${v.filecode}`;
    } else {
      url = `https://vizey.co/v/${v.filecode}`;
    }

    container.innerHTML += `
      <div class="card" onclick="window.open('${url}', '_blank')">
        <img src="${v.thumbnail}" loading="lazy">
        <div class="title">${v.title}</div>
      </div>
    `;
  });
}

/* SEARCH */
document.getElementById("search").addEventListener("input", e => {
  const keyword = e.target.value.toLowerCase();

  const filtered = allVideos.filter(v =>
    v.title.toLowerCase().includes(keyword)
  );

  renderVideos(filtered);
});

/* INIT */
loadVideos();
</script>

</body>
</html>
