<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asupanmu</title>

<style>
body {
  margin:0;
  background:#000;
  color:#fff;
  font-family:sans-serif;
}

h1 {
  padding:15px;
}

#search {
  width:90%;
  margin:10px;
  padding:12px;
  border-radius:10px;
  border:2px solid orange;
}

.grid {
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:10px;
  padding:10px;
}

.video {
  cursor:pointer;
}

.video img {
  width:100%;
  border-radius:10px;
}

.video p {
  font-size:12px;
}

.ads {
  text-align:center;
}
</style>
</head>

<body>

<h1>Asupanmu</h1>

<div class="ads">
  <button onclick="bukaIklan()">🔥 Klik di sini 🔥</button>
</div>

<input id="search" placeholder="Cari video...">

<div class="grid" id="videoList"></div>

<script>
let allVideos = []
let page = 0
let limit = 10
let loading = false
let iklanSudah = false

// ======================
// IKLAN 1x
// ======================
function bukaIklan(){
  if(!iklanSudah){
    window.open("https://www.profitablecpmratenetwork.com/s6szeryj1j?key=67a910e3b4387aa420b25f4a4bfa41b1","_blank")
    iklanSudah = true
  }
}

// ======================
// FETCH API
// ======================
async function loadVideos(){
  if(loading) return
  loading = true

  const res = await fetch("/api/videos")
  const data = await res.json()

  allVideos = data.videos || []

  renderNext()

  loading = false
}

// ======================
// RENDER NEXT (INFINITE)
// ======================
function renderNext(){
  const list = document.getElementById("videoList")

  const start = page * limit
  const end = start + limit

  const slice = allVideos.slice(start, end)

  slice.forEach(v=>{
    const div = document.createElement("div")
    div.className = "video"

    div.innerHTML = `
      <img loading="lazy" src="${v.thumbnail}">
      <p>${v.title}</p>
    `

    div.onclick = ()=>play(v.filecode, v.source)

    list.appendChild(div)
  })

  page++
}

// ======================
// PLAY VIDEO
// ======================
function play(id, source){
  if(source==="vidara"){
    location.href = `https://vidara.so/v/${id}`
  }else if(source==="dood"){
    location.href = `https://doodstream.com/d/${id}`
  }else{
    location.href = `https://vizey.com/d/${id}`
  }
}

// ======================
// SCROLL LOAD
// ======================
window.addEventListener("scroll", ()=>{
  if(window.innerHeight + window.scrollY >= document.body.offsetHeight - 200){
    renderNext()
  }
})

// ======================
// SEARCH
// ======================
document.getElementById("search").addEventListener("input", e=>{
  const val = e.target.value.toLowerCase()

  const filtered = allVideos.filter(v =>
    v.title.toLowerCase().includes(val)
  )

  document.getElementById("videoList").innerHTML = ""
  page = 0
  allVideos = filtered
  renderNext()
})

// ======================
loadVideos()
</script>

</body>
</html>
