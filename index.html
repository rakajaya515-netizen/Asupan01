<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Asupanmu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: black;
      color: white;
      font-family: sans-serif;
      margin: 0;
      padding: 15px;
    }

    h1 {
      font-size: 32px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 2px solid orange;
      margin-bottom: 15px;
    }

    #videoList {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .video {
      cursor: pointer;
    }

    .video img {
      width: 100%;
      border-radius: 10px;
    }

    .video p {
      font-size: 14px;
      margin: 5px 0;
    }
  </style>
</head>
<body>

<h1>Asupanmu</h1>

<input type="text" id="search" placeholder="Cari video...">

<div id="videoList"></div>

<script src="script.js"></script>
</body>
</html>
