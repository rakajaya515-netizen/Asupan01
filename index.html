<!DOCTYPE html>
<html>
<head>
  <title>Streaming Video</title>
</head>
<body>

<h1>𝔸𝕤𝕦𝕡𝕒𝕟 𝕋𝕖𝕣𝕖𝕟𝕒𝕜</h1>
<div id="videos"></div>

<script>
fetch("https://asupan01.vercel.app/api/videos")
  .then(res => res.json())
  .then(data => {
    console.log("DATA API:", data);

    const container = document.getElementById("videos");

    // ambil array video (biasanya di data.data)
    const videos = data.data || [];

    videos.forEach(video => {
      const el = document.createElement("video");

      // coba beberapa kemungkinan field
      el.src =
        video.url ||
        video.file ||
        video.video_url ||
        video.link ||
        "";

      el.controls = true;
      el.width = 300;

      if (el.src) {
        container.appendChild(el);
      }
    });
  })
  .catch(err => {
    console.error("ERROR:", err);
  });
</script>

</body>
</html>
