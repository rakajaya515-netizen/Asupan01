  <!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streaming</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: sans-serif;
}

.search {
  padding: 10px;
}

.search input {
  width: 100%;
  padding: 12px;
  border-radius: 20px;
  border: none;
  outline: none;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 10px;
}

.card {
  position: relative;
  border-radius: 15px;
  overflow: hidden;
  cursor: pointer;
}

.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.overlay {
  position: absolute;
  bottom: 0;
  width: 100%;
  padding: 10px;
  background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
}

.overlay p {
  margin: 0;
  font-size: 14px;
}

/* MODAL PLAYER */
#modal {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

#player {
  width:100%;
  height:100%;
  border:none;
}

.close {
  position:absolute;
  top:10px;
  right:15px;
  font-size:25px;
  cursor:pointer;
  z-index:1000;
}

#loading {
  position:absolute;
  color:white;
}
</style>
</head>

<body>

<div class="search">
  <input type="text" id="searchInput" placeholder="Search video...">
</div>

<div class="grid" id="videos"></div>

<!-- PLAYER -->
<div id="modal">
  <div class="close" onclick="closePlayer()">✖</div>
  <div id="loading">Loading...</div>
  <iframe id="player" allowfullscreen></iframe>
</div>

<script>
let allVideos = [];

async function loadVideos() {
  try {
    const res = await fetch("/api/videos");
    const data = await res.json();

    console.log("DATA:", data);

    if (!data.videos || data.videos.length === 0) {
      document.getElementById("videos").innerHTML = "<p>No videos</p>";
      return;
    }

    allVideos = data.videos;
    renderVideos(allVideos);

  } catch (err) {
    document.getElementById("videos").innerHTML = "<p>Error load video</p>";
  }
}

function renderVideos(videos) {
  const container = document.getElementById("videos");
  container.innerHTML = "";

  videos.forEach(v => {
    container.innerHTML += `
      <div class="card" onclick="play('${v.filecode}')">
        <img loading="lazy" src="${v.thumbnail}">
        <div class="overlay">
          <p>${v.title}</p>
        </div>
      </div>
    `;
  });
}

function play(code) {
  const modal = document.getElementById("modal");
  const player = document.getElementById("player");
  const loading = document.getElementById("loading");

  modal.style.display = "flex";
  loading.style.display = "block";

  player.src = "";

  setTimeout(() => {
    player.src = "https://vidara.to/e/" + code;
  }, 200);

  player.onload = () => {
    loading.style.display = "none";
  };

  // fallback kalau lama
  setTimeout(() => {
    if (loading.style.display === "block") {
      window.open("https://vidara.to/v/" + code, "_blank");
    }
  }, 5000);
}

function closePlayer() {
  document.getElementById("modal").style.display = "none";
  document.getElementById("player").src = "";
}

/* SEARCH */
document.getElementById("searchInput").addEventListener("input", function() {
  const q = this.value.toLowerCase();

  const filtered = allVideos.filter(v =>
    (v.title || "").toLowerCase().includes(q)
  );

  renderVideos(filtered);
});

loadVideos();
</script>

</body>
</html>
