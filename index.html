<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asupanmu</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #000;
  color: #fff;
}

h1 {
  padding: 16px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 10px;
}

.card {
  background: #111;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
}

.card img {
  width: 100%;
  height: 140px;
  object-fit: cover;
  background: #222;
}

.title {
  padding: 8px;
  font-size: 14px;
}
</style>
</head>

<body>

<h1>Asupanmu</h1>

<div id="videos" class="grid"></div>
<p id="empty" style="text-align:center;display:none;">Tidak ada video</p>

<script>
async function loadVideos() {
  try {
    const res = await fetch('/api/videos')
    const data = await res.json()

    console.log("API:", data)

    const videos = data.result?.videos || []

    const container = document.getElementById('videos')
    const empty = document.getElementById('empty')

    if (!videos.length) {
      empty.style.display = 'block'
      return
    }

    container.innerHTML = ''

    videos.forEach(v => {

      // 🔥 FIX THUMBNAIL
      let thumb = v.thumbnail || ''

      if (!thumb || thumb.includes("undefined")) {
        thumb = "https://via.placeholder.com/300x200?text=No+Image"
      }

      // 🔥 LINK KE PAGE ASLI
      let link = "#"

      if (v.source === "vizey") {
        link = `https://vizey.co/view/${v.filecode}`
      }

      if (v.source === "vidara") {
        link = `https://vidara.to/${v.filecode}`
      }

      container.innerHTML += `
        <div class="card" onclick="window.open('${link}','_blank')">
          <img src="${thumb}" onerror="this.src='https://via.placeholder.com/300x200?text=Error'">
          <div class="title">${v.title}</div>
        </div>
      `
    })

  } catch (err) {
    console.error(err)
  }
}

loadVideos()
</script>

</body>
</html>
