<!DOCTYPE html>
<html>
<head>
  <title>Streaming</title>
  <style>
    body { background: #111; color: white; font-family: sans-serif; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .card { background: #222; padding: 10px; border-radius: 10px; }
    video { width: 100%; border-radius: 10px; }
  </style>
</head>
<body>

<h2>Video Streaming</h2>

<div class="grid" id="videos"></div>

<script>
fetch("videos.json")
.then(res => res.json())
.then(data => {
  let container = document.getElementById("videos");
  data.forEach(v => {
    container.innerHTML += `
      <div class="card">
        <video controls src="${v.url}"></video>
        <p>${v.title}</p>
      </div>
    `;
  });
});
</script>

</body>
</html>
