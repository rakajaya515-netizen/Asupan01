<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Asupanmu</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#000;
      color:#fff;
    }

    .navbar{
      position:sticky;
      top:0;
      z-index:999;
      background:#000;
      padding:20px 15px;
    }

    .title{
      font-size:42px;
      font-weight:900;
      color:#ff39c6;
      margin-bottom:15px;
    }

    .search{
      width:100%;
      padding:16px;
      border:none;
      border-radius:18px;
      background:#111;
      color:#fff;
      font-size:18px;
      outline:none;
    }

    .container{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
      padding:12px;
    }

    .card,
    .ad-card{
      background:#111;
      border-radius:20px;
      overflow:hidden;
      position:relative;
    }

    .card{
      height:260px;
      cursor:pointer;
    }

    .card img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .card-title{
      position:absolute;
      left:0;
      right:0;
      bottom:0;

      padding:10px;

      background:linear-gradient(
        transparent,
        rgba(0,0,0,.95)
      );

      font-size:14px;
      font-weight:bold;
      color:white;

      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .ad-card{
      min-height:250px;
    }

    .loading,
    .nomore{
      text-align:center;
      padding:25px;
      font-size:20px;
    }

    @media(max-width:500px){
      .container{
        grid-template-columns:repeat(2,1fr);
      }

      .card{
        height:240px;
      }

      .title{
        font-size:34px;
      }
    }
  </style>
</head>

<body>

  <div class="navbar">
    <div class="title">Asupanmu</div>

    <input
      id="search"
      class="search"
      placeholder="Search video..."
    />
  </div>

  <div id="videos" class="container"></div>

  <div id="loading" class="loading">
    Loading videos...
  </div>

  <script>
let videosGlobal = [];
let filteredVideos = [];

let page = 1;
let loading = false;
let hasMore = true;

const container =
  document.getElementById("videos");

const loadingText =
  document.getElementById("loading");

const searchInput =
  document.getElementById("search");

// 🔥 Popunder sekali
function triggerPopunder() {

  if (!localStorage.getItem("popShown")) {

    localStorage.setItem("popShown", "true");

    window.open(
      "https://www.profitableratecpm.com/s65zeryji1?key=67a910e3b4387aa420b25f4a4bfa41b1",
      "_blank"
    );
  }
}

// 🔥 Native ads
function createNativeAd() {

  const ad = document.createElement("div");

  ad.className = "ad-card";

  const script =
    document.createElement("script");

  script.async = true;

  script.src =
    "https://pl29343712.profitableratecpm.com/d6c7cfa2fbe3ee841c92a4f50371bf35/invoke.js";

  const nativeContainer =
    document.createElement("div");

  nativeContainer.id =
    "container-d6c7cfa2fbe3ee841c92a4f50371bf35-" +
    Math.random();

  ad.appendChild(script);

  ad.appendChild(nativeContainer);

  return ad;
}

// 🔥 Render cards
function renderVideos(videos, reset = false) {

  if (reset) {
    container.innerHTML = "";
  }

  videos.forEach((v, i) => {

    // ads tiap 6 video
    if ((container.children.length + 1) % 6 === 0) {

      container.appendChild(
        createNativeAd()
      );
    }

    const el =
      document.createElement("div");

    el.className = "card";

    el.innerHTML = `
      <img
        src="${v.thumbnail}"
        loading="lazy"
      />

      <div class="card-title">
        ${v.title || "Untitled Video"}
      </div>
    `;

    el.onclick = () => {

      triggerPopunder();

      window.location.href =
        \`https://vizey.net/v/\${v.id}\`;
    };

    container.appendChild(el);
  });
}

// 🔥 Load videos
async function loadVideos() {

  if (loading || !hasMore) return;

  loading = true;

  loadingText.innerHTML =
    "Loading videos...";

  try {

    const res =
      await fetch(`/api/videos?page=${page}`);

    const data =
      await res.json();

    const videos =
      data.videos || [];

    videosGlobal.push(...videos);

    // jika search kosong
    if (!searchInput.value.trim()) {

      renderVideos(videos);

    } else {

      filterVideos();
    }

    hasMore = data.hasMore;

    page++;

    if (!hasMore) {

      loadingText.innerHTML =
        "No more videos";
    }

  } catch (err) {

    loadingText.innerHTML =
      "Failed load videos";
  }

  loading = false;
}

// 🔥 Search
function filterVideos() {

  const q =
    searchInput.value.toLowerCase();

  filteredVideos =
    videosGlobal.filter(v =>

      (v.title || "")
      .toLowerCase()
      .includes(q)
    );

  renderVideos(filteredVideos, true);
}

searchInput.addEventListener(
  "input",
  filterVideos
);

// 🔥 Infinite scroll
window.addEventListener(
  "scroll",
  () => {

    if (
      window.innerHeight +
      window.scrollY >=
      document.body.offsetHeight - 1000
    ) {

      loadVideos();
    }
  }
);

// init
loadVideos();
</script>
  </script>

  <!-- 🔥 SOCIAL BAR -->
  <script
    src="https://pl29343713.profitableratecpm.com/9a/69/24/9a6924d62fcb5f212667f72bfbb2378f.js">
  </script>

</body>
</html>
