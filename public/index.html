<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Asupanmu</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
font-family:Arial,sans-serif;
color:#fff;
}

.header{
padding:24px 20px 10px;
position:sticky;
top:0;
background:#000;
z-index:999;
}

.logo{
font-size:60px;
font-weight:900;
color:#ff33cc;
margin-bottom:20px;
}

.search{
width:100%;
padding:18px 22px;
border:none;
border-radius:20px;
background:#111;
color:#fff;
font-size:20px;
outline:none;
}

.container{
padding:10px;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.card{
background:#111;
border-radius:18px;
overflow:hidden;
cursor:pointer;
}

.card img{
width:100%;
height:270px;
object-fit:cover;
background:#222;
}

.title{
padding:12px;
font-size:16px;
font-weight:bold;
line-height:1.4;
}

.loading{
text-align:center;
padding:40px;
font-size:22px;
color:#aaa;
}

</style>
</head>
<body>

<div class="header">
<div class="logo">Asupanmu</div>

<input
type="text"
class="search"
id="search"
placeholder="Search video..."
>
</div>

<div id="videos" class="container"></div>

<div id="loading" class="loading">
Loading videos...
</div>

<script>

const container = document.getElementById("videos");
const loading = document.getElementById("loading");
const search = document.getElementById("search");

let allVideos = [];

async function loadVideos(){

try{

const response = await fetch("/api/videos");

const data = await response.json();

allVideos = data.videos || [];

renderVideos(allVideos);

loading.innerHTML =
allVideos.length > 0
? ""
: "No videos found";

}catch(err){

loading.innerHTML = "Failed load videos";

}

}

function renderVideos(videos){

container.innerHTML = "";

videos.forEach(video=>{

const card = document.createElement("div");

card.className = "card";

card.innerHTML = `
<img loading="lazy" src="${video.thumbnail}" alt="">
<div class="title">
${video.title || "Untitled"}
</div>
`;

card.onclick = ()=>{

window.location.href =
`https://vizey.net/v/${video.id}`;

};

container.appendChild(card);

});

}

search.addEventListener("input",(e)=>{

const q = e.target.value.toLowerCase();

const filtered = allVideos.filter(v=>
(v.title || "")
.toLowerCase()
.includes(q)
);

renderVideos(filtered);

});

loadVideos();

</script>

</body>
</html>
