<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Asupanmu</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
font-family:Arial,sans-serif;
color:white;
}

header{
padding:20px;
position:sticky;
top:0;
z-index:100;
background:#000;
}

.logo{
font-size:60px;
font-weight:900;
color:#ff2dcf;
margin-bottom:20px;
}

.search{
width:100%;
padding:18px;
border:none;
border-radius:25px;
background:#0f0f13;
color:white;
font-size:18px;
outline:none;
}

.container{
padding:12px;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.card{
background:#111;
border-radius:20px;
overflow:hidden;
cursor:pointer;
}

.thumb{
width:100%;
aspect-ratio:9/16;
object-fit:cover;
background:#222;
}

.info{
padding:12px;
}

.title{
font-size:16px;
font-weight:700;
line-height:1.3;
display:-webkit-box;
-webkit-line-clamp:2;
-webkit-box-orient:vertical;
overflow:hidden;
}

.source{
margin-top:8px;
color:#b86cff;
font-size:14px;
}

.loading{
text-align:center;
padding:30px;
font-size:20px;
}

@media(max-width:600px){
.logo{
font-size:42px;
}
}
</style>
</head>
<body>

<header>
<div class="logo">Asupanmu</div>

<input
type="text"
class="search"
placeholder="Search video..."
id="search"
/>
</header>

<div class="container" id="videos"></div>

<div class="loading" id="loading">
Loading videos...
</div>

<script>

const container = document.getElementById("videos");
const loading = document.getElementById("loading");
const searchInput = document.getElementById("search");

let allVideos = [];

async function loadVideos(){

loading.innerText = "Loading videos...";

try{

const res = await fetch("/api/videos");

const data = await res.json();

allVideos = data.videos || [];

renderVideos(allVideos);

loading.innerText =
`${allVideos.length} videos loaded`;

}catch(err){

loading.innerText = "Failed loading videos";

console.log(err);

}

}

function renderVideos(videos){

container.innerHTML = "";

videos.forEach(video=>{

const card = document.createElement("div");

card.className = "card";

card.innerHTML = `
<img
class="thumb"
src="${video.thumbnail}"
loading="lazy"
>

<div class="info">
<div class="title">
${video.title || "Untitled"}
</div>

<div class="source">
vizey
</div>
</div>
`;

card.onclick = ()=>{
window.location.href =
`https://vizey.net/v/${video.id}`;
};

container.appendChild(card);

});

}

searchInput.addEventListener("input",(e)=>{

const value = e.target.value.toLowerCase();

const filtered = allVideos.filter(v=>
(v.title || "")
.toLowerCase()
.includes(value)
);

renderVideos(filtered);

});

loadVideos();

</script>
