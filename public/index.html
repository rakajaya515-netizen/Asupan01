<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asupanmu</title>

<style>
body { margin:0; background:#0d0d0d; color:white; font-family:sans-serif; }

.navbar {
  position:sticky;
  top:0;
  background:#0d0d0d;
  padding:12px;
}

.logo { font-family:cursive; font-size:22px; }

input {
  width:100%;
  padding:10px;
  border-radius:20px;
  border:none;
  margin-top:10px;
  background:#1a1a1a;
  color:white;
}

.grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:10px;
}

.card {
  position:relative;
  border-radius:12px;
  overflow:hidden;
}

.card img {
  width:100%;
  height:180px;
  object-fit:cover;
}

.title {
  position:absolute;
  bottom:0;
  padding:8px;
  background:linear-gradient(transparent, black);
}
</style>
</head>

<body>

<div class="navbar">
  <div class="logo">Asupanmu</div>
  <input id="search" placeholder="Search...">
</div>

<div id="grid" class="grid"></div>

<script>
const grid = document.getElementById("grid");
const search = document.getElementById("search");

let all = [];

function fix(url){
  if(!url) return "https://via.placeholder.com/300x200";
  return url.replace("http://","https://");
}

async function load(){
  try{
    const res = await fetch("/api/videos");
    const data = await res.json();

    all = data.map(v=>({
      ...v,
      thumb: fix(v.thumb)
    }));

    render(all);

  }catch{
    grid.innerHTML = "<p style='padding:20px'>Gagal load</p>";
  }
}

function render(data){
  grid.innerHTML = "";

  data.forEach(v=>{
    const el = document.createElement("div");
    el.className="card";

    el.innerHTML = `
      <img src="${v.thumb}" onerror="this.src='https://via.placeholder.com/300x200'">
      <div class="title">${v.title}</div>
    `;

    el.onclick=()=>window.open(v.link,"_blank");

    grid.appendChild(el);
  });
}

search.oninput = ()=>{
  const q = search.value.toLowerCase();
  render(all.filter(v=>v.title.toLowerCase().includes(q)));
};

load();
</script>

</body>
</html>
