<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asupanmu</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

.navbar{
  position:sticky;
  top:0;
  z-index:999;
  background:#000;
  padding:20px 16px;
}

.logo{
  font-size:52px;
  font-weight:900;
  color:#ff2fcf;
  margin-bottom:18px;
}

.search{
  width:100%;
  padding:18px;
  border:none;
  outline:none;
  border-radius:20px;
  background:#111;
  color:#fff;
  font-size:20px;
}

.container{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  padding:14px;
}

.card{
  background:#111;
  border-radius:20px;
  overflow:hidden;
  cursor:pointer;

  contain:content;
}

.card img{
  width:100%;
  height:260px;
  object-fit:cover;
  display:block;
}

.card-title{
  padding:12px;
  font-size:15px;
  font-weight:bold;
  line-height:1.4;
  word-break:break-word;
}

.loading{
  text-align:center;
  padding:30px;
  font-size:22px;
}

.ad-box{
  background:#111;
  border-radius:20px;
  overflow:hidden;
  min-height:260px;
}

@media(max-width:600px){

  .logo{
    font-size:48px;
  }

  .card img{
    height:220px;
  }

}

</style>
</head>

<body>

<div class="navbar">

  <div class="logo">
    Asupanmu
  </div>

  <input
    type="text"
    id="search"
    class="search"
    placeholder="Search video..."
  >

</div>

<div id="videos" class="container"></div>

<div id="loading" class="loading">
  Loading videos...
</div>

<script>

let page = 1;
let loading = false;
let hasMore = true;

let filteredMode = false;

let videosGlobal = [];

let nextPageCache = null;

const container =
  document.getElementById("videos");

const loadingText =
  document.getElementById("loading");


// 🔥 Popunder
function triggerPopunder(){

  if(localStorage.getItem("popShown"))
    return;

  localStorage.setItem("popShown","true");

  window.open(
    "https://www.profitableratecpm.com/s65zeryji1?key=67a910e3b4387aa420b25f4a4bfa41b1",
    "_blank"
  );

}


// 🔥 Native Ads
function createNativeAd(){

  const ad = document.createElement("div");

  ad.className = "ad-box";

  const script =
    document.createElement("script");

  script.async = true;

  script.src =
    "//pl29343712.profitableratecpm.com/d6c7cfa2fbe3ee841c92a4f50371bf35/invoke.js";

  const ins =
    document.createElement("div");

  ins.id =
    "container-d6c7cfa2fbe3ee841c92a4f50371bf35";

  ad.appendChild(script);

  ad.appendChild(ins);

  return ad;

}


// 🔥 Render videos
function renderVideos(videos){

  const fragment =
    document.createDocumentFragment();

  videos.forEach((v, i) => {

    // ads tiap 8 video
    if(
      (container.children.length + i + 1) % 8 === 0
    ){

      fragment.appendChild(
        createNativeAd()
      );

    }

    const el =
      document.createElement("div");

    el.className = "card";

    el.innerHTML = `
      <img
        src="${v.thumbnail}"
        loading="lazy"
        decoding="async"
        referrerpolicy="no-referrer"
      >

      <div class="card-title">
        ${v.title || "Untitled Video"}
      </div>
    `;

    el.onclick = () => {

      triggerPopunder();

      window.location.href =
        \`https://vizey.net/v/\${v.id}\`;

    };

    fragment.appendChild(el);

  });

  requestAnimationFrame(() => {
    container.appendChild(fragment);
  });

}


// 🔥 Fetch page
async function fetchPage(pageNum){

  const res =
    await fetch(
      \`/api/videos?page=\${pageNum}\`
    );

  return await res.json();

}


// 🔥 Preload next page
async function preloadNextPage(){

  if(!hasMore) return;

  try{

    nextPageCache =
      await fetchPage(page + 1);

  }catch(err){
    console.log(err);
  }

}


// 🔥 Load videos
async function loadVideos(){

  if(
    loading ||
    !hasMore ||
    filteredMode
  ) return;

  loading = true;

  loadingText.innerHTML =
    "Loading videos...";

  try{

    let data;

    // pakai cache
    if(nextPageCache){

      data = nextPageCache;

      nextPageCache = null;

    }else{

      data =
        await fetchPage(page);

    }

    const videos =
      data.videos || [];

    videosGlobal.push(...videos);

    renderVideos(videos);

    hasMore = data.hasMore;

    page++;

    // preload page berikutnya
    preloadNextPage();

    if(!hasMore){

      loadingText.innerHTML =
        "No more videos";

    }else{

      loadingText.innerHTML = "";

    }

  }catch(err){

    console.log(err);

    loadingText.innerHTML =
      "Failed load videos";

  }

  loading = false;

}


// 🔥 Infinite scroll ultra smooth
window.addEventListener(
  "scroll",
  () => {

    if(
      window.innerHeight +
      window.scrollY >=
      document.body.offsetHeight - 1800
    ){

      loadVideos();

    }

  },
  { passive:true }
);


// 🔥 Search
document
.getElementById("search")
.addEventListener("input", e => {

  const q =
    e.target.value.toLowerCase();

  if(q.length === 0){

    filteredMode = false;

    container.innerHTML = "";

    renderVideos(videosGlobal);

    return;

  }

  filteredMode = true;

  const filtered =
    videosGlobal.filter(v =>

      (v.title || "")
      .toLowerCase()
      .includes(q)

    );

  container.innerHTML = "";

  renderVideos(filtered);

});


// 🔥 First load
loadVideos();

</script>
