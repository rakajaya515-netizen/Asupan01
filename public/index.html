<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Asupanmu</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

.navbar{
  position:sticky;
  top:0;
  z-index:999;
  background:#000;
  padding:20px;
}

.logo{
  font-size:52px;
  font-weight:900;
  color:#ff2fcf;
  margin-bottom:20px;
}

.search{
  width:100%;
  padding:18px;
  border:none;
  border-radius:20px;
  background:#111;
  color:#fff;
  font-size:20px;
  outline:none;
}

.container{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  padding:14px;
}

.card{
  background:#111;
  border-radius:20px;
  overflow:hidden;
  cursor:pointer;
}

.card img{
  width:100%;
  height:260px;
  object-fit:cover;
  display:block;
}

.card-title{
  padding:12px;
  font-size:15px;
  font-weight:bold;
  line-height:1.4;
}

.loading{
  text-align:center;
  padding:30px;
  font-size:20px;
}

.ad-box{
  background:#111;
  border-radius:20px;
  overflow:hidden;
  min-height:260px;
}

@media(max-width:600px){
  .card img{
    height:220px;
  }
}
</style>
</head>

<body>

<div class="navbar">
  <div class="logo">Asupanmu</div>

  <input
    type="text"
    id="search"
    class="search"
    placeholder="Search video..."
  />
</div>

<div id="videos" class="container"></div>

<div id="loading" class="loading">
  Loading videos...
</div>

<script>

let page = 1;
let loading = false;
let hasMore = true;

let videosGlobal = [];
let filteredMode = false;

const container = document.getElementById("videos");
const loadingText = document.getElementById("loading");


// 🔥 Popunder sekali
function triggerPopunder(){

  if(localStorage.getItem("popShown")) return;

  localStorage.setItem("popShown","true");

  window.open(
    "https://www.profitableratecpm.com/s65zeryji1?key=67a910e3b4387aa420b25f4a4bfa41b1",
    "_blank"
  );
}


// 🔥 Native ads
function createNativeAd(){

  const ad = document.createElement("div");
  ad.className = "ad-box";

  const script = document.createElement("script");
  script.async = true;
  script.src =
    "//pl29343712.profitableratecpm.com/d6c7cfa2fbe3ee841c92a4f50371bf35/invoke.js";

  const ins = document.createElement("div");
  ins.id =
    "container-d6c7cfa2fbe3ee841c92a4f50371bf35";

  ad.appendChild(script);
  ad.appendChild(ins);

  return ad;
}


// 🔥 Render videos
function renderVideos(videos, reset = false){

  if(reset){
    container.innerHTML = "";
  }

  const fragment = document.createDocumentFragment();

  videos.forEach((v, i) => {

    // ads tiap 8 video
    if((container.children.length + i + 1) % 8 === 0){
      fragment.appendChild(createNativeAd());
    }

    const el = document.createElement("div");
    el.className = "card";

    el.innerHTML = `
      <img
        src="${v.thumbnail}"
        loading="lazy"
      >

      <div class="card-title">
        ${v.title || "Untitled Video"}
      </div>
    `;

    el.onclick = () => {

      triggerPopunder();

      window.location.href =
        `https://vizey.net/v/${v.id}`;
    };

    fragment.appendChild(el);

  });

  container.appendChild(fragment);
}


// 🔥 Fetch API
async function fetchVideos(pageNum){

  const res = await fetch(`/api/videos?page=${pageNum}`);

  return await res.json();
}


// 🔥 Load videos
async function loadVideos(){

  if(loading || !hasMore || filteredMode) return;

  loading = true;

  loadingText.innerHTML = "Loading videos...";

  try{

    const data = await fetchVideos(page);

    const videos = data.videos || [];

    videosGlobal.push(...videos);

    renderVideos(videos);

    hasMore = data.hasMore;

    page++;

    if(!hasMore){
      loadingText.innerHTML = "No more videos";
    }

  }catch(err){

    console.log(err);

    loadingText.innerHTML = "Failed load videos";

  }

  loading = false;
}


// 🔥 Infinite scroll
window.addEventListener("scroll", () => {

  if(
    window.innerHeight + window.scrollY >=
    document.body.offsetHeight - 1000
  ){
    loadVideos();
  }

});


// 🔥 Search
document.getElementById("search")
.addEventListener("input", e => {

  const q = e.target.value.toLowerCase();

  if(q.length > 0){

    filteredMode = true;

    const filtered = videosGlobal.filter(v =>
      v.title.toLowerCase().includes(q)
    );

    renderVideos(filtered, true);

  }else{

    filteredMode = false;

    renderVideos(videosGlobal, true);
  }

});


// 🔥 First load
loadVideos();

</script>

<!-- SOCIAL BAR -->
<script
src="//pl29343713.profitableratecpm.com/9a/69/24/9a6924d62fcb5f212667f72bfbb2378f.js">
</script>

</body>
</html>
