<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Asupanmu</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #0d0d0d;
  color: white;
}

/* NAVBAR */
.navbar {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: #0d0d0d;
  padding: 12px;
}

.logo {
  font-size: 20px;
  font-weight: bold;
  font-family: cursive;
}

/* SEARCH */
.search-box {
  margin-top: 10px;
}

.search-box input {
  width: 100%;
  padding: 10px;
  border-radius: 20px;
  border: none;
  outline: none;
  background: #1a1a1a;
  color: white;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 10px;
}

.card {
  position: relative;
  border-radius: 15px;
  overflow: hidden;
  cursor: pointer;
}

.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.title {
  position: absolute;
  bottom: 0;
  padding: 8px;
  font-size: 14px;
  background: linear-gradient(transparent, black);
}
</style>
</head>

<body>

<div class="navbar">
  <div class="logo">Asupanmu</div>

  <div class="search-box">
    <input type="text" id="search" placeholder="Search..." />
  </div>
</div>

<div class="grid" id="grid"></div>

<script>
const grid = document.getElementById("grid");
const searchInput = document.getElementById("search");

let allVideos = [];

/* CACHE */
function setCache(data) {
  localStorage.setItem("videos_cache", JSON.stringify({
    time: Date.now(),
    data
  }));
}

function getCache() {
  const cache = localStorage.getItem("videos_cache");
  if (!cache) return null;

  const parsed = JSON.parse(cache);
  if (Date.now() - parsed.time > 60000) return null;

  return parsed.data;
}

/* FIX IMAGE */
function fixImage(url) {
  if (!url) return "";

  if (url.startsWith("http://")) {
    url = url.replace("http://", "https://");
  }

  // paksa lewat proxy (ANTI BLOCK)
  return `/api/image?url=${encodeURIComponent(url)}`;
}

/* FETCH */
async function fetchVideos() {
  try {
    const cache = getCache();
    if (cache) {
      allVideos = cache;
      render(cache);
      return;
    }

    const [res1, res2] = await Promise.all([
      fetch("/api/vidara"),
      fetch("/api/vizey")
    ]);

    const vidara = await res1.json();
    const vizey = await res2.json();

    const merged = [
      ...(Array.isArray(vidara) ? vidara : []).map(v => ({
        title: v.title || "No title",
        thumb: fixImage(v.thumbnail),
        link: v.link
      })),

      ...(Array.isArray(vizey) ? vizey : []).map(v => ({
        title: v.title || "No title",
        thumb: fixImage(v.thumbnail || v.thumb || ""),
        link: v.url || `https://vizey.co/${v.id}`
      }))
    ];

    allVideos = merged;
    setCache(merged);
    render(merged);

  } catch (err) {
    console.error(err);
    grid.innerHTML = "<p style='padding:20px'>Gagal load</p>";
  }
}

/* RENDER */
function render(data) {
  grid.innerHTML = "";

  if (!data.length) {
    grid.innerHTML = "<p style='padding:20px'>Tidak ada video</p>";
    return;
  }

  data.forEach(v => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <img 
        loading="lazy"
        src="${v.thumb}" 
        onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'"
      />
      <div class="title">${v.title}</div>
    `;

    div.onclick = () => window.open(v.link, "_blank");

    grid.appendChild(div);
  });
}

/* SEARCH */
searchInput.addEventListener("input", () => {
  const keyword = searchInput.value.toLowerCase();

  const filtered = allVideos.filter(v =>
    v.title.toLowerCase().includes(keyword)
  );

  render(filtered);
});

/* LOAD */
fetchVideos();
      </script>
