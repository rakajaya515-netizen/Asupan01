<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Asupanmu</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#000;
color:#fff;
}

.navbar{
position:sticky;
top:0;
z-index:999;
background:#000;
padding:20px 15px;
}

.logo{
font-size:52px;
font-weight:900;
color:#ff3cc7;
margin-bottom:15px;
}

.search{
width:100%;
padding:18px 20px;
border:none;
outline:none;
border-radius:20px;
background:#111;
color:#fff;
font-size:20px;
}

.container{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
padding:12px;
}

.card{
background:#111;
border-radius:20px;
overflow:hidden;
cursor:pointer;
transition:.2s;
}

.card:active{
transform:scale(.96);
}

.thumb{
width:100%;
aspect-ratio:9/14;
object-fit:cover;
display:block;
background:#222;
}

.info{
padding:10px;
}

.title{
font-size:16px;
font-weight:700;
line-height:1.4;
display:-webkit-box;
-webkit-line-clamp:2;
-webkit-box-orient:vertical;
overflow:hidden;
}

.source{
margin-top:8px;
color:#bb66ff;
font-size:14px;
}

.loading,
.end,
.empty{
text-align:center;
padding:30px;
font-size:22px;
}

@media(max-width:500px){

.logo{
font-size:42px;
}

.title{
font-size:14px;
}

.container{
gap:10px;
padding:10px;
}

}
</style>
</head>

<body>

<div class="navbar">
<div class="logo">Asupanmu</div>

<input
type="text"
class="search"
id="search"
placeholder="Search video..."
/>
</div>

<div class="container" id="videos"></div>

<div class="loading" id="loading">
Loading videos...
</div>

<script>

const container = document.getElementById("videos");
const loading = document.getElementById("loading");
const searchInput = document.getElementById("search");

let allVideos = [];
let page = 1;
let loadingData = false;
let hasMore = true;

async function fetchVideos(pageNum){

try{

const res = await fetch(`/api/videos?page=${pageNum}`);

if(!res.ok){
throw new Error("API Error");
}

return await res.json();

}catch(err){

console.log(err);

return {
videos: [],
hasMore: false
};

}

}

function createCard(video){

const card = document.createElement("div");
card.className = "card";

card.innerHTML = `
<img
class="thumb"
src="${video.thumbnail}"
loading="lazy"
referrerpolicy="no-referrer"
/>

<div class="info">
<div class="title">
${video.title || "Untitled Video"}
</div>

<div class="source">
vizey
</div>
</div>
`;

card.onclick = () => {

window.location.href =
`https://vizey.net/v/${video.id}`;

};

return card;

}

function renderVideos(videos, reset=false){

if(reset){
container.innerHTML = "";
}

const fragment = document.createDocumentFragment();

videos.forEach(video => {

fragment.appendChild(
createCard(video)
);

});

container.appendChild(fragment);

}

async function loadVideos(){

if(loadingData || !hasMore) return;

loadingData = true;

loading.style.display = "block";

const data = await fetchVideos(page);

const videos = data.videos || [];

if(videos.length > 0){

allVideos.push(...videos);

renderVideos(videos);

page++;

}else{

hasMore = false;

loading.innerHTML = "No more videos";

}

loadingData = false;

}

window.addEventListener("scroll", () => {

const scrollTop =
window.scrollY;

const screenHeight =
window.innerHeight;

const fullHeight =
document.body.offsetHeight;

if(
scrollTop + screenHeight >=
fullHeight - 1000
){
loadVideos();
}

});

searchInput.addEventListener("input", e => {

const q =
e.target.value.toLowerCase();

const filtered =
allVideos.filter(v =>
(v.title || "")
.toLowerCase()
.includes(q)
);

renderVideos(filtered, true);

});

loadVideos();

</script>

</body>
</html>
