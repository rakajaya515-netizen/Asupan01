<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Asupanindo</title>

  <link
    rel="stylesheet"
    href="style.css"
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

</head>

<body>

  <!-- NAVBAR -->

  <header class="navbar">

    <div class="logo">
      Asupanindo
    </div>

    <div class="search-wrapper">

      <input
        type="text"
        id="search"
        placeholder="Search..."
      />

    </div>

  </header>


  <!-- VIDEO GRID -->

  <main>

    <div
      id="videos"
      class="grid"
    ></div>

    <div
      id="loading"
      class="loading"
    >
      Loading videos...
    </div>

  </main>

  <script src="script.js"></script>

</body>
</html>
